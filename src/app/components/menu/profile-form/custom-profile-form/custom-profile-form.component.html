<div [formGroup]="form">
  <mat-form-field class="field">
    <mat-label>{{ 'CUSTOM.COMMAND' | translate }}</mat-label>
    <textarea matInput type="text"
              formControlName="customExecPath"
              cdkTextareaAutosize>

    </textarea>
    <mat-hint align="start"><strong>{{ 'CUSTOM.EXEC_HINT' | translate }}</strong></mat-hint>
    @if (form.get('customExecPath')?.value) {
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear"
      (click)="clear(form, 'customExecPath')">
      <mat-icon>close</mat-icon>
    </button>
    }
    @if (form.get('customExecPath')?.invalid && form.get('customExecPath')?.touched) {
      <mat-error>{{ errorFor('customExecPath') | translate }}</mat-error>
    }
  </mat-form-field>

  <br/>
  <br/>

  <app-auth-form
    formControlName="auth"
    [supportedAuthTypes]="AUTH_OPTIONS"
    [secretTypes]="SECRET_TYPES"
    [authRequired]="true"
    [requireLogin]="true">
  </app-auth-form>
</div>
